<div class="card">
  <img [src]="product.imgUrl" class="card-img-top" alt="...">
  <div class="card-body" [class.bg-danger]="product.quantity==0">
    <h5 class="card-title">{{product.name}}</h5>
    <p class="card-text">Price is {{product.price}}</p>
    <p class="card-text">quantity is {{product.quantity}}</p>
    <input type="number" #t1>
    <button (click)="add(+t1.value)" [disabled]="product.quantity==0">add</button>
  </div>
</div>
